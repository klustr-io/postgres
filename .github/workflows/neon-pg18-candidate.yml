name: Neon OCI images
on:
  pull_request:
    branches: [REL_18_STABLE_neon, main]
  push:
    branches: [REL_18_STABLE_neon, main, 'release/**']
    tags: ['neon-v18.*']
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish commit-tagged development images to GHCR
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: neon-images-${{ startsWith(github.ref, 'refs/tags/') && 'release' || github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - uses: ./.github/actions/neon-controller-check
      - name: Build entry point syntax
        run: |
          node --check neon/build.mjs
          node --check neon/publish.mjs
          node --check neon/dev/checks/security/scan-release.mjs
          node --check neon/controller/tenant-compute/src/infrastructure/provisioning/TenantProvisioning.mjs
          node --check neon/controller/tenant-compute/src/infrastructure/compose/ComposeRuntime.mjs
          node --check neon/controller/tenant-compute/src/application/database/Databases.mjs
          node --check neon/controller/tenant-compute/src/application/storage/StorageFleet.mjs
          node --check neon/controller/tenant-compute/src/infrastructure/keda/KedaScaler.mjs
          node --check neon/packaging/deploy/render.mjs
  build:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.value }}
    env:
      BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Reclaim unused SDK space on the disposable runner
        env:
          HOSTED_RUNNER: ${{ runner.environment }}
        shell: bash
        run: |
          set -euo pipefail
          test "$HOSTED_RUNNER" = github-hosted
          test "$RUNNER_OS" = Linux
          df -h "$GITHUB_WORKSPACE"
          # Compilation runs inside the pinned toolchain image. These hosted
          # SDKs are unused; keep the runner, Node toolcache and Docker intact.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/share/swift /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/miniconda
          available=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print $4}')
          df -h "$GITHUB_WORKSPACE"
          printf 'Available build disk: %s KiB (minimum 33554432 KiB)\n' "$available"
          test "$available" -ge 33554432 || { echo 'At least 32 GiB free disk is required'; exit 1; }
      - uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5.6.0
        with:
          version: 'v29.7.2'
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: 'v0.36.1'
          driver-opts: image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
      - name: Select image version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            value="${GITHUB_REF_NAME#neon-v}"
            [[ "$GITHUB_REF_NAME" == neon-v18.* ]]
          else
            value="sha-$GITHUB_SHA"
          fi
          [[ "$value" =~ ^[a-z0-9][a-z0-9_.-]{0,110}$ ]]
          echo "value=$value" >> "$GITHUB_OUTPUT"
      - name: Compile all seven images and run basic image checks
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          npm ci --prefix neon/controller/tenant-compute --ignore-scripts --no-audit --no-fund
          node neon/build.mjs --version="$IMAGE_VERSION" --verify-native-oauth
      - name: Upload OCI images, source receipt and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neon-linux-amd64-${{ github.sha }}
          path: |
            build/monorepo-*/build.json
            build/monorepo-*/*.log
            build/monorepo-*/images/*.oci.tar
          compression-level: 0
          overwrite: true
          retention-days: 14
          if-no-files-found: error
  publish:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    concurrency:
      group: neon-ghcr-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - uses: docker/setup-docker-action@7ec28a010822b4626af4874f9448a4b05ac6f3e5 # v5.6.0
        with:
          version: 'v29.7.2'
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: 'v0.36.1'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: neon-linux-amd64-${{ github.sha }}
          path: build/incoming
      - name: Publish verified images and release assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE_VERSION: ${{ needs.build.outputs.version }}
        run: node neon/publish.mjs --input=build/incoming --version="$IMAGE_VERSION"
      - name: Retain registry digest manifest
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neon-publication-${{ github.sha }}
          overwrite: true
          path: |
            build/published-release/release-manifest.json
            build/published-release/SHA256SUMS
            build/published-release/release-notes.md
            build/published-release/security/*.json
          if-no-files-found: warn
      - name: Clear runner registry login
        if: always()
        run: docker logout ghcr.io
