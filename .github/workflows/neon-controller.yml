name: Neon database controller
on:
  push:
    branches: [main, REL_18_STABLE_neon, 'release/**']
    paths:
      - neon/controller/tenant-compute/**
      - neon/packaging/neon/controller-rootfs.mjs
      - neon/packaging/docker/neon/runtime/Dockerfile.tenant-controller
      - neon/packaging/docker/shared/debian.sources
      - neon/packaging/kubernetes/base/**
      - neon/packaging/kubernetes/keda/**
      - neon/packaging/kubernetes/fleet-stack.json
      - neon/packaging/deploy/render.mjs
      - neon/dev/quality/**
      - neon/tests/neon/unit/**
      - .github/actions/neon-controller-check/**
      - .github/workflows/neon-controller.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: neon-controller-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - uses: ./.github/actions/neon-controller-check
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Publish controller by source commit
        shell: bash
        run: |
          set -euo pipefail
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/neon-tenant-controller"
          docker buildx build --platform linux/amd64 --provenance=true --sbom=true \
            --build-arg "SOURCE_REVISION=$GITHUB_SHA" \
            --file neon/packaging/docker/neon/runtime/Dockerfile.tenant-controller \
            --tag "$repository:controller-sha-$GITHUB_SHA" --metadata-file controller-image.json --push .
          digest=$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("controller-image.json"))["containerimage.digest"])')
          printf 'Controller image: `%s@%s`\nSource commit: `%s`\n' "$repository" "$digest" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload image publication receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: neon-controller-${{ github.sha }}
          path: controller-image.json
          retention-days: 14
      - name: Download the publication receipt
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: neon-controller-${{ github.sha }}
          path: build/controller-receipt
      - name: Verify the artifact upload/download contract
        run: cmp controller-image.json build/controller-receipt/controller-image.json
      - name: Registry logout
        if: always()
        run: docker logout ghcr.io
