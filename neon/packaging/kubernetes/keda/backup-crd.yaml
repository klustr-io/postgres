# Deployment source: neon/packaging/deploy/render.mjs
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: neonbackups.neon.klustr.io
spec:
  group: neon.klustr.io
  scope: Namespaced
  names:
    kind: NeonBackup
    plural: neonbackups
    singular: neonbackup
    shortNames:
      - neonbackup
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Database
          type: string
          jsonPath: .spec.database
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Expires
          type: string
          jsonPath: .status.expiresAt
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - database
                - databaseUID
                - retentionSeconds
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: Backup identity and retention are immutable
              properties:
                database:
                  type: string
                  pattern: ^[a-z][a-z0-9-]{0,38}$
                databaseUID:
                  type: string
                  minLength: 1
                  maxLength: 128
                retentionSeconds:
                  type: integer
                  minimum: 300
                  maximum: 31536000
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
