# Deployment source: neon/packaging/deploy/render.mjs
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: neon-database-control-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: neon-tenant-controller
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: keda
      ports:
        - protocol: TCP
          port: 9091
    - from:
        - podSelector:
            matchLabels:
              neon.klustr.io/webhook-client: "true"
      ports:
        - protocol: TCP
          port: 8080
