apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: neon
resources:
  - ../base
  - database-crd.yaml
  - backup-crd.yaml
  - fleet-crd.yaml
  - fleet.yaml
  - rbac.yaml
  - trigger-authentication.yaml
  - network-policy.yaml
