# Deployment source: neon/packaging/deploy/render.mjs
apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Service
    metadata:
      name: metadata
    spec:
      clusterIP: None
      publishNotReadyAddresses: true
      selector:
        app: metadata
      ports:
        - name: postgres
          port: 5432
          targetPort: 5432
  - apiVersion: apps/v1
    kind: StatefulSet
    metadata:
      name: metadata
    spec:
      serviceName: metadata
      replicas: 1
      selector:
        matchLabels:
          app: metadata
      template:
        metadata:
          labels:
            app: metadata
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          terminationGracePeriodSeconds: 120
          containers:
            - name: metadata
              image: ghcr.io/klustr-io/neon-compute@sha256:c7d0b5e0a359941fb766253bd8e2b0f8fe6408a6fa855ebf0287070ef280abc8
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
                - |-
                  if [ ! -f /var/lib/neon/metadata/PG_VERSION ]; then /opt/postgres/v18/bin/initdb -D /var/lib/neon/metadata -U neon --pwfile=/run/metadata/password --auth-host=scram-sha-256; fi; printf "local all all trust
                   host postgres neon 0.0.0.0/0 scram-sha-256
                   host postgres neon ::/0 scram-sha-256
                  " > /var/lib/neon/metadata/pg_hba.conf; exec /opt/postgres/v18/bin/postgres -D /var/lib/neon/metadata -c listen_addresses=* -p 5432
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
              ports:
                - name: postgres
                  containerPort: 5432
              readinessProbe:
                exec:
                  command:
                    - /opt/postgres/v18/bin/pg_isready
                    - -U
                    - neon
                    - -d
                    - postgres
              volumeMounts:
                - name: data
                  mountPath: /var/lib/neon
                - name: metadata
                  mountPath: /run/metadata
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
            - name: metadata
              secret:
                secretName: neon-metadata
                defaultMode: 288
          nodeSelector:
            kubernetes.io/arch: amd64
            kubernetes.io/os: linux
      volumeClaimTemplates:
        - metadata:
            name: data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
  - apiVersion: v1
    kind: Service
    metadata:
      name: storage-broker
    spec:
      selector:
        app: storage-broker
      ports:
        - name: grpc
