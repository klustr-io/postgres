  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: storage-controller
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: storage-controller
      template:
        metadata:
          labels:
            app: storage-controller
        spec:
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: controller
              image: ghcr.io/klustr-io/neon-storage-controller@sha256:4716c664590fea18d9a49bd36502ff9ff6d47352f1a952213b606d1cf04bd13b
              command:
                - /bin/sh
                - -ec
                - exec /usr/local/bin/storage_controller --listen 0.0.0.0:1234 --initial-split-threshold 17179869184 --initial-split-shards 2 --split-threshold 1099511627776 --max-split-shards 16 --control-plane-url http://neon-controller:9090 --control-plane-jwt-token "$(cat /run/neon/controller-token)" --address-for-peers http://storage-controller:1234 --database-url "postgresql://neon:$(cat /run/metadata/password)@metadata:5432/postgres" --public-key="$(cat /run/neon/storage.pub)" --jwt-token "$(cat /run/neon/pageserver.jwt)" --safekeeper-jwt-token "$(cat /run/neon/safekeeper.jwt)" --peer-jwt-token "$(cat /run/neon/peer.jwt)"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              ports:
                - containerPort: 1234
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              readinessProbe:
                tcpSocket:
                  port: 1234
              volumeMounts:
                - name: storage-config
                  mountPath: /run/neon
                  readOnly: true
                - name: metadata
                  mountPath: /run/metadata
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: storage-config
              secret:
                secretName: neon-storage-controller-config
                defaultMode: 288
            - name: metadata
              secret:
                secretName: neon-metadata
                defaultMode: 288
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
          nodeSelector:
            kubernetes.io/arch: amd64
            kubernetes.io/os: linux
