# Opt-in candidate; accepted tail loss is up to one second for compute loss or
# one storage-node failure. Compound failures during partitions are excluded.
# Safekeeper disks MUST remain synchronous. Do not use these compute settings
# for controller metadata PG, safekeepers or standalone PostgreSQL.
# Planned sleep requires closed admission, the privileged native drain, and a
# persisted ownership/frontier handoff before removing compute.
fsync = off
synchronous_commit = off
full_page_writes = on
wal_compression = zstd
neon.bounded_async_commit = on
neon.bounded_async_max_age = 750ms
neon.bounded_async_max_wal = 64MB
