# Default candidate profile: acknowledgement waits for the safekeeper quorum.
# The provisioner must retain Neon's walproposer synchronous_standby_names.
fsync = on
synchronous_commit = on
full_page_writes = on
wal_compression = zstd
# Enable native frontier tracking/drain; synchronous_commit keeps fast ACKs off.
neon.bounded_async_commit = on
