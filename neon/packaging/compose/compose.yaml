# Deployment source: neon/packaging/deploy/render.mjs
name: neon
services:
  init:
    platform: linux/amd64
    restart: no
    user: 0:0
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1770,size=256m
    image: ${NEON_CONTROLLER_IMAGE:-ghcr.io/klustr-io/neon-tenant-controller@sha256:fe71ce0d74172f1c10b612930822ad2f86575cef9fc96f58ffdc230be94ba246}
    entrypoint:
      - /usr/local/bin/node
    volumes:
      - state:/state
      - ./config:/etc/neon:ro
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    command:
      - /app/deploy/bootstrap.mjs
      - init
  metadata:
    platform: linux/amd64
    restart: unless-stopped
    user: 10001:10001
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1770,size=256m
    image: ghcr.io/klustr-io/neon-compute@sha256:c7d0b5e0a359941fb766253bd8e2b0f8fe6408a6fa855ebf0287070ef280abc8
    entrypoint:
      - /bin/sh
      - -ec
      - |-
        if [ ! -f /var/lib/neon/metadata/PG_VERSION ]; then /opt/postgres/v18/bin/initdb -D /var/lib/neon/metadata -U neon --pwfile=/run/metadata/password --auth-host=scram-sha-256; fi; printf "local all all trust
         host postgres neon 0.0.0.0/0 scram-sha-256
         host postgres neon ::/0 scram-sha-256
        " > /var/lib/neon/metadata/pg_hba.conf; exec /opt/postgres/v18/bin/postgres -D /var/lib/neon/metadata -c listen_addresses=* -p 5432
    volumes:
      - type: volume
        source: state
        target: /run/metadata
        read_only: true
        volume:
          subpath: metadata
      - metadata:/var/lib/neon
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - /opt/postgres/v18/bin/pg_isready
        - -U
        - neon
        - -d
        - postgres
      interval: 3s
      timeout: 3s
      retries: 30
  storage-broker:
    platform: linux/amd64
    restart: unless-stopped
    user: 10001:10001
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1770,size=256m
    image: ghcr.io/klustr-io/neon-storage-broker@sha256:c66d30b177d651148d2c70e52c9e974a289dca236aa8cfa33896a8ed6cf55208
  storage-controller:
    platform: linux/amd64
    restart: unless-stopped
    user: 10001:10001
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1770,size=256m
    image: ghcr.io/klustr-io/neon-storage-controller@sha256:4716c664590fea18d9a49bd36502ff9ff6d47352f1a952213b606d1cf04bd13b
    entrypoint:
      - /bin/sh
      - -ec
      - exec /usr/local/bin/storage_controller --listen 0.0.0.0:1234 --initial-split-threshold 17179869184 --initial-split-shards 2 --split-threshold 1099511627776 --max-split-shards 16 --control-plane-url http://neon-controller:9090 --control-plane-jwt-token "$(cat /run/neon/controller-token)" --address-for-peers http://storage-controller:1234 --database-url "postgresql://neon:$(cat /run/metadata/password)@metadata:5432/postgres" --public-key="$(cat /run/neon/storage.pub)" --jwt-token "$(cat /run/neon/pageserver.jwt)" --safekeeper-jwt-token "$(cat /run/neon/safekeeper.jwt)" --peer-jwt-token "$(cat /run/neon/peer.jwt)"
    volumes:
      - type: volume
        source: state
        target: /run/neon
        read_only: true
        volume:
          subpath: storage-controller
      - type: volume
        source: state
        target: /run/metadata
        read_only: true
        volume:
          subpath: metadata
    depends_on:
      init:
        condition: service_completed_successfully
      metadata:
        condition: service_healthy
  pageserver:
    platform: linux/amd64
    restart: unless-stopped
    user: 10001:10001
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1770,size=256m
    image: ghcr.io/klustr-io/neon-pageserver@sha256:b5e045980dd183cdb853cfb870696a31bee85e05aba927163b7c78bb20473d53
    entrypoint:
      - /bin/sh
      - -ec
      - cat /run/neon/pageserver.toml > /var/lib/neon/pageserver.toml; printf "id=1\n" > /var/lib/neon/identity.toml; export NEON_AUTH_TOKEN="$(cat /run/neon/safekeeper.jwt)"; exec /usr/local/bin/pageserver -D /var/lib/neon
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - type: volume
        source: state
        target: /run/neon
        read_only: true
        volume:
          subpath: pageserver
      - pageserver:/var/lib/neon
    depends_on:
      init:
        condition: service_completed_successfully
      storage-controller:
        condition: service_started
  pageserver-2:
    platform: linux/amd64
    restart: unless-stopped
    user: 10001:10001
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1770,size=256m
    image: ghcr.io/klustr-io/neon-pageserver@sha256:b5e045980dd183cdb853cfb870696a31bee85e05aba927163b7c78bb20473d53
    entrypoint:
      - /bin/sh
      - -ec
      - cat /run/neon/pageserver.toml > /var/lib/neon/pageserver.toml; printf "id=2\n" > /var/lib/neon/identity.toml; export NEON_AUTH_TOKEN="$(cat /run/neon/safekeeper.jwt)"; exec /usr/local/bin/pageserver -D /var/lib/neon
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - type: volume
        source: state
        target: /run/neon
        read_only: true
        volume:
          subpath: pageserver
      - pageserver-2:/var/lib/neon
    depends_on:
      init:
        condition: service_completed_successfully
      storage-controller:
        condition: service_started
  safekeeper-1:
    platform: linux/amd64
    restart: unless-stopped
    user: 10001:10001
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1770,size=256m
    image: ghcr.io/klustr-io/neon-safekeeper@sha256:102cad9f13f67e1da256d69e5437399ad090e2100c63136a10b3f52b4b0c4b59
    entrypoint:
      - /bin/sh
      - -ec
      - exec /usr/local/bin/safekeeper -D /var/lib/neon --id 1 --listen-pg 0.0.0.0:5454 --listen-http 0.0.0.0:7676 --advertise-pg safekeeper-1:5454 --broker-endpoint http://storage-broker:50051 --pg-auth-public-key-path /run/neon/storage.pub --http-auth-public-key-path /run/neon/storage.pub --auth-token-path /run/neon/safekeeper.jwt --remote-storage "$(cat /run/neon/remote.toml)"
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - type: volume
        source: state
        target: /run/neon
        read_only: true
        volume:
          subpath: safekeeper
      - safekeeper-1:/var/lib/neon
    depends_on:
      init:
        condition: service_completed_successfully
  safekeeper-2:
    platform: linux/amd64
    restart: unless-stopped
    user: 10001:10001
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1770,size=256m
    image: ghcr.io/klustr-io/neon-safekeeper@sha256:102cad9f13f67e1da256d69e5437399ad090e2100c63136a10b3f52b4b0c4b59
    entrypoint:
      - /bin/sh
      - -ec
      - exec /usr/local/bin/safekeeper -D /var/lib/neon --id 2 --listen-pg 0.0.0.0:5454 --listen-http 0.0.0.0:7676 --advertise-pg safekeeper-2:5454 --broker-endpoint http://storage-broker:50051 --pg-auth-public-key-path /run/neon/storage.pub --http-auth-public-key-path /run/neon/storage.pub --auth-token-path /run/neon/safekeeper.jwt --remote-storage "$(cat /run/neon/remote.toml)"
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - type: volume
        source: state
        target: /run/neon
        read_only: true
        volume:
          subpath: safekeeper
      - safekeeper-2:/var/lib/neon
    depends_on:
      init:
        condition: service_completed_successfully
  safekeeper-3:
    platform: linux/amd64
    restart: unless-stopped
    user: 10001:10001
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1770,size=256m
    image: ghcr.io/klustr-io/neon-safekeeper@sha256:102cad9f13f67e1da256d69e5437399ad090e2100c63136a10b3f52b4b0c4b59
    entrypoint:
      - /bin/sh
      - -ec
      - exec /usr/local/bin/safekeeper -D /var/lib/neon --id 3 --listen-pg 0.0.0.0:5454 --listen-http 0.0.0.0:7676 --advertise-pg safekeeper-3:5454 --broker-endpoint http://storage-broker:50051 --pg-auth-public-key-path /run/neon/storage.pub --http-auth-public-key-path /run/neon/storage.pub --auth-token-path /run/neon/safekeeper.jwt --remote-storage "$(cat /run/neon/remote.toml)"
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"
    volumes:
      - type: volume
        source: state
        target: /run/neon
        read_only: true
        volume:
          subpath: safekeeper
      - safekeeper-3:/var/lib/neon
    depends_on:
      init:
        condition: service_completed_successfully
  provision:
    platform: linux/amd64
    restart: on-failure:5
    user: 10001:10001
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1770,size=256m
    image: ${NEON_CONTROLLER_IMAGE:-ghcr.io/klustr-io/neon-tenant-controller@sha256:fe71ce0d74172f1c10b612930822ad2f86575cef9fc96f58ffdc230be94ba246}
    entrypoint:
      - /usr/local/bin/node
    volumes:
      - state:/state
      - ./config:/etc/neon:ro
    command:
      - /app/deploy/bootstrap.mjs
      - provision
    depends_on:
      pageserver:
        condition: service_started
      pageserver-2:
        condition: service_started
      safekeeper-1:
        condition: service_started
      safekeeper-2:
        condition: service_started
      safekeeper-3:
        condition: service_started
  controller:
    platform: linux/amd64
    restart: unless-stopped
    user: 10001:10001
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      backend:
        aliases:
          - neon-controller
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1770,size=256m
    image: ${NEON_CONTROLLER_IMAGE:-ghcr.io/klustr-io/neon-tenant-controller@sha256:fe71ce0d74172f1c10b612930822ad2f86575cef9fc96f58ffdc230be94ba246}
    entrypoint:
      - /usr/local/bin/node
    volumes:
      - state:/state
      - ./config:/etc/neon:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - /app/server.mjs
    group_add:
      - ${DOCKER_GID:-0}
    environment:
      NEON_PLATFORM: compose
      NEON_DOCKER_PROJECT: ${COMPOSE_PROJECT_NAME:-neon}
      NEON_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-neon}-backend
      NEON_DOCKER_STATE_VOLUME: ${COMPOSE_PROJECT_NAME:-neon}-state
      CONTROLLER_API_TOKEN_FILE: /state/controller-token
      NEON_DEPLOYMENT_CONFIG: /etc/neon/cluster.yaml
      CONTROLLER_TLS_KEY: /state/controller.key
      CONTROLLER_TLS_CERT: /state/controller.crt
    depends_on:
      init:
        condition: service_completed_successfully
  proxy:
    platform: linux/amd64
    restart: unless-stopped
    user: 10001:10001
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1770,size=256m
    image: ghcr.io/klustr-io/neon-proxy@sha256:562852b3eecd2726fcdf05d592e5d6692f7cff1c9434c2db2509a29559d49dd5
    entrypoint:
      - /bin/sh
      - -ec
      - export NEON_PROXY_TO_CONTROLPLANE_TOKEN="$(cat /run/neon/controller-token)"; exec /usr/local/bin/proxy --proxy 0.0.0.0:5432 --http 0.0.0.0:7001 --auth-backend control-plane --auth-endpoint https://neon-controller:8080/ --tls-key /run/neon/proxy.key --tls-cert /run/neon/proxy.crt --wake-compute-cache size=0
    environment:
      SSL_CERT_FILE: /run/neon/ca.crt
      OTEL_SDK_DISABLED: "true"
    volumes:
      - type: volume
        source: state
        target: /run/neon
        read_only: true
        volume:
          subpath: proxy
    ports:
      - ${NEON_BIND_ADDRESS:-127.0.0.1}:${NEON_PORT:-55432}:5432
    depends_on:
      controller:
        condition: service_started
  compute-image:
    platform: linux/amd64
    restart: no
    user: 10001:10001
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    tmpfs:
      - /tmp:uid=10001,gid=10001,mode=1770,size=256m
    image: ghcr.io/klustr-io/neon-compute@sha256:c7d0b5e0a359941fb766253bd8e2b0f8fe6408a6fa855ebf0287070ef280abc8
    profiles:
      - pull
    entrypoint:
      - /opt/postgres/v18/bin/postgres
    command:
      - --version
networks:
  backend:
    name: ${COMPOSE_PROJECT_NAME:-neon}-backend
volumes:
  state:
    name: ${COMPOSE_PROJECT_NAME:-neon}-state
  metadata:
    name: ${COMPOSE_PROJECT_NAME:-neon}-metadata
  pageserver:
    name: ${COMPOSE_PROJECT_NAME:-neon}-pageserver
  pageserver-2:
    name: ${COMPOSE_PROJECT_NAME:-neon}-pageserver-2
  safekeeper-1:
    name: ${COMPOSE_PROJECT_NAME:-neon}-safekeeper-1
  safekeeper-2:
    name: ${COMPOSE_PROJECT_NAME:-neon}-safekeeper-2
  safekeeper-3:
    name: ${COMPOSE_PROJECT_NAME:-neon}-safekeeper-3
